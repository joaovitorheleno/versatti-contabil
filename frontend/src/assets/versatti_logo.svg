<svg viewBox="0 0 660 210" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="barA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7FCBA0"/>
      <stop offset="100%" stop-color="#5CAE84"/>
    </linearGradient>
    <linearGradient id="barB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C7EDD8"/>
      <stop offset="100%" stop-color="#A3DFBE"/>
    </linearGradient>
  </defs>

  <!-- Mark: two uneven bars meeting like a V, the right arm rising higher to read as growth -->
  <g>
    <rect x="87" y="35" width="26" height="140" rx="10" fill="url(#barA)"
          transform="rotate(-27 100 175)"/>
    <rect x="90" y="4" width="20" height="171" rx="9" fill="url(#barB)"
          transform="rotate(23 100 175)"/>
  </g>

  <!-- Wordmark -->
  <text x="205" y="118" font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="66" font-weight="700" fill="#233830">Versatti</text>
  <text x="207" y="151" font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="21" font-weight="500" letter-spacing="3" fill="#5CAE84">contabilidade</text>
</svg>
